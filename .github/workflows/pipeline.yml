name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint:
    name: 🏗️ Build & Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Code
        run: pnpm lint

      - name: Type Check
        run: pnpm typecheck

      - name: Build Next.js App
        run: pnpm build

      - name: Verify standalone build
        run: |
          if [ ! -d ".next/standalone" ]; then
            echo "❌ Error: .next/standalone folder not found!"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          include-hidden-files: true
          path: |
            .next/standalone
            .next/static
            public
            !**/.env*
          retention-days: 1

  integration-test:
    name: 🧪 Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        shell: bash
        run: |
          if [ -d "tests" ]; then
            pnpm test:unit --passWithNoTests
          else
            echo "⚠️ No 'tests' folder. Skipping."
          fi

  e2e-test:
    name: 🎭 Production Smoke
    runs-on: ubuntu-24.04
    needs: build-lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Check for E2E tests
        id: check_e2e
        shell: bash
        run: |
          if [ -f "tests/prod-smoke.spec.ts" ]; then
            echo "tests_exist=true" >> $GITHUB_OUTPUT
          else
            echo "tests_exist=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Playwright Browsers
        if: steps.check_e2e.outputs.tests_exist == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production smoke
        if: steps.check_e2e.outputs.tests_exist == 'true'
        run: pnpm test:e2e:prod --project=chromium
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-verify:
    name: 🛡️ Patched Container Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [e2e-test, integration-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build patched production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          pull: true
          load: true
          push: false
          tags: previo-security-check:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify native runtime and normal Brotli decoding
        run: |
          docker run --rm --entrypoint node previo-security-check:ci -e '
            const assert = require("node:assert/strict");
            const zlib = require("node:zlib");
            assert.equal(process.version, "v22.23.4");
            assert.equal(typeof zlib.constants.BROTLI_DECODER_ERROR_FORMAT_BLOCK_SWITCH, "number");
            assert.notEqual(process.getuid(), 0);
            const input = Buffer.from("Previo patched runtime smoke");
            assert.deepEqual(zlib.brotliDecompressSync(zlib.brotliCompressSync(input)), input);
            console.log(JSON.stringify({ node: process.version, brotli: process.versions.brotli, uid: process.getuid(), normalBrotli: true }));
          '
      - name: Verify standalone server starts
        run: |
          docker run --detach --name previo-security-smoke --publish 127.0.0.1:3000:3000 --env HOSTNAME=0.0.0.0 previo-security-check:ci
          trap 'docker logs previo-security-smoke; docker rm --force previo-security-smoke' EXIT
          container_ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000; then
              container_ready=1
              break
            fi
            sleep 2
          done
          test "$container_ready" = 1

  docker:
    name: 🐳 Docker Release
    runs-on: ubuntu-24.04
    needs: [docker-verify]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set repo name to lowercase
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: release
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          pull: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published digest runtime
        env:
          IMAGE_REF: ghcr.io/${{ env.REPO_LOWER }}@${{ steps.release.outputs.digest }}
        run: |
          docker pull "$IMAGE_REF"
          docker run --rm --entrypoint node "$IMAGE_REF" -e '
            const assert = require("node:assert/strict");
            assert.equal(process.version, "v22.23.4");
            assert.equal(typeof require("node:zlib").constants.BROTLI_DECODER_ERROR_FORMAT_BLOCK_SWITCH, "number");
            assert.notEqual(process.getuid(), 0);
            console.log(JSON.stringify({ node: process.version, brotli: process.versions.brotli, uid: process.getuid() }));
          '
